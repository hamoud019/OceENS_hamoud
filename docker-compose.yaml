services:
  oceens:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ${LOCAL_DATABASE_DIR:-./database}:/app/database
      # Le paquet est installé dans .venv : import/ y est lu (core/seed.py)
      - ./src/oceens/import:/app/.venv/lib/python3.12/site-packages/oceens/import
    restart: always
